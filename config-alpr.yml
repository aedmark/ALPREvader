graphhopper:
  datareader.file: illinois-latest.osm.pbf
  graph.location: graph-cache
  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps
  graph.encoded_values: car_access, car_average_speed

  profiles:
    - name: car
      custom_model_files: [car.json]

  profiles_ch:
    - profile: car

  profiles_lm: []

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: localhost
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost